name: refresh data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py && python scripts/build_data.py
      - name: Commit data
        run: |
          git config user.name "Parveen Kumar Naresh Kumar"
          git config user.email "220802990+parveen06naresh@users.noreply.github.com"
          git add data/raw web/data.js
          git commit -m "Refresh market data" || echo "no changes"
          git push

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine tests
        run: node --test 'tests/*.test.mjs'
      - name: Data file matches the raw data
        run: |
          python scripts/build_data.py
          git diff --exit-code web/data.js
      - name: Bundle builds
        run: python scripts/bundle.py --standalone https://parveenkumar.site/crash-replay
